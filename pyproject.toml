[project]
name = "os"
version = "1.0.0"
description = "OS - a real-time voice-first AI assistant. Local-first, Python end-to-end."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Phase 4: Pydantic AI supervisor (primary orchestration layer).
    # Ollama provider = local model, no API keys, no cloud.
    "pydantic-ai-slim[ollama]>=2.0",
    # Phase 8: MCP tool bus (official SDK, MIT). Local stdio only.
    "mcp==2.2.0",
    # Animated terminal UI (arc-reactor boot, spinners). Pure Python,
    # degrades to plain text when missing.
    "rich>=13",
    # Web dashboard (`os dashboard`). Localhost only.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Dashboard connector vault (encrypted credentials) + date parsing.
    "cryptography>=42",
    "python-dateutil>=2.9",
    # system_info tool (CPU/memory/disk stats used by dashboard + CLI).
    "psutil>=5.9",
    # Documents tab (PDF view/fill/export, OpenMuse port). Pure Python, local.
    "pypdf>=6",
]
[project.optional-dependencies]
voice = [
    # Real voice pipeline (mic -> AEC -> VAD -> STT -> TTS -> speaker).
    # torch is CPU-only here; install the CUDA build yourself for GPU.
    "faster-whisper>=1.0",
    "silero-vad>=5.0",
    "pocket-tts>=3.0",
    "sounddevice>=0.4",
    "torch>=2.0",
    # Optional: Pipecat-based runner (server/voice/pipecat_runner.py).
    # "pipecat-ai>=1.0",
    # Optional: Pipecat local audio transport needs PyAudio (system PortAudio
    # headers required to build it).
    # "pyaudio>=0.2",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
google = [
    # Live Google connectors (Calendar, Gmail, Drive, Sheets, YouTube).
    # Optional: dashboard works without them; Google connectors just
    # report "setup failed" until these are installed.
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",
    "python-dateutil>=2.9",
]

[project.scripts]
os = "os_cli:main"

[tool.setuptools]
py-modules = ["os_cli", "cli", "voice_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "client*", "config*", "web*"]
exclude = ["tests*", "logs*", "memory*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
